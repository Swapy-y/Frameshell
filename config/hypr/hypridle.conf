# Frame - hypridle (idle management)  ->  ~/.config/hypr/hypridle.conf
# Started from hyprland.lua. Times are in seconds.
#
# Nothing happens on its own while the computer is idle: no automatic lock, no
# screen off, no suspend. hypridle only locks the screen right before a suspend
# you start yourself (the moon button, `systemctl suspend`), so the computer
# wakes up locked. To bring an idle action back, remove the '#' in front of
# its listener block below and log out and back in.
# (With no listener, hypridle's log says "No rules configured": that is expected.)

general {
    lock_cmd         = bash ~/.config/quickshell/frame/scripts/lock.sh             # the Pixie lock screen (hyprlock if it fails); one at a time
    before_sleep_cmd = bash ~/.config/quickshell/frame/scripts/lock.sh --instant   # lock before suspend: at once, no fade
    after_sleep_cmd  = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    inhibit_sleep    = 3                                                           # suspend only once the lock screen is really up
}

# Lock after 5 minutes — off.
# listener {
#     timeout    = 300
#     on-timeout = loginctl lock-session
# }

# Screen off after 6 minutes (any key / mouse move wakes it again) — off.
# listener {
#     timeout    = 360
#     on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
#     on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
# }

# Suspend after 30 minutes — off. Suspend/resume with NVIDIA needs the
# nvidia-suspend/-resume/-hibernate services (install.sh enables them).
# listener {
#     timeout    = 1800
#     on-timeout = systemctl suspend
# }
