; Frame - qt6ct colour scheme (goes to ~/.config/qt6ct/colors/frame.conf)
; The palette Qt apps use, the same as the Frame Kvantum theme's and the GTK theme's:
; #1a1a1a windows, #313131 buttons, white text, grey (#3e3e3e) selected text, white accent.
; Each line lists the colours for one state (active / disabled / inactive) in qt6ct's fixed order.

[ColorScheme]
active_colors=#ffffffff, #ff313131, #ff3a3a3a, #ff333333, #ff0f0f0f, #ff1f1f1f, #ffffffff, #ffffffff, #ffffffff, #ff1a1a1a, #ff1a1a1a, #ff000000, #ff3e3e3e, #ffffffff, #ff6aa3d9, #ffb48ead, #ff1f1f1f, #ff000000, #ff2a2a2a, #ffffffff, #ff8c8c8c, #ffffffff
disabled_colors=#ff6a6a6a, #ff313131, #ff3a3a3a, #ff333333, #ff0f0f0f, #ff1f1f1f, #ff6a6a6a, #ffffffff, #ff6a6a6a, #ff1a1a1a, #ff1a1a1a, #ff000000, #ff3a3a3a, #ff8c8c8c, #ff6a6a6a, #ff6a6a6a, #ff1f1f1f, #ff000000, #ff2a2a2a, #ffffffff, #ff575757, #ff575757
inactive_colors=#ffffffff, #ff313131, #ff3a3a3a, #ff333333, #ff0f0f0f, #ff1f1f1f, #ffffffff, #ffffffff, #ffffffff, #ff1a1a1a, #ff1a1a1a, #ff000000, #ff3e3e3e, #ffffffff, #ff6aa3d9, #ffb48ead, #ff1f1f1f, #ff000000, #ff2a2a2a, #ffffffff, #ff8c8c8c, #ffffffff
