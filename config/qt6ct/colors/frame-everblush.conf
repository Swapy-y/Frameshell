; Frame Everblush - qt6ct colour scheme (goes to ~/.config/qt6ct/colors/frame-everblush.conf)
; The palette Qt apps use while Everblush is the shell's theme (scripts/theme.sh switches it),
; the same as the FrameEverblush Kvantum theme's and the Frame-Everblush GTK theme's.
; Made by themes/make-themes.py: change the theme's colours in Config.qml (Noir's: its palette
; in make-themes.py) and run it again.
; Each line lists the colours for one state (active / disabled / inactive) in qt6ct's fixed order.

[ColorScheme]
active_colors=#ffdadada, #ff2b3235, #ff343b3e, #ff2d3437, #ff0c1011, #ff192023, #ffdadada, #ffdadada, #ffdadada, #ff141b1e, #ff141b1e, #ff000000, #ff383f42, #ffdadada, #ff67b0e8, #ffc47fd5, #ff192023, #ff000000, #ff232a2d, #ffdadada, #ff8a8d8e, #ff67b0e8
disabled_colors=#ff676b6d, #ff2b3235, #ff343b3e, #ff2d3437, #ff0c1011, #ff192023, #ff676b6d, #ffdadada, #ff676b6d, #ff141b1e, #ff141b1e, #ff000000, #ff343b3e, #ff8a8d8e, #ff676b6d, #ff676b6d, #ff192023, #ff000000, #ff232a2d, #ffdadada, #ff54595b, #ff54595b
inactive_colors=#ffdadada, #ff2b3235, #ff343b3e, #ff2d3437, #ff0c1011, #ff192023, #ffdadada, #ffdadada, #ffdadada, #ff141b1e, #ff141b1e, #ff000000, #ff383f42, #ffdadada, #ff67b0e8, #ffc47fd5, #ff192023, #ff000000, #ff232a2d, #ffdadada, #ff8a8d8e, #ff67b0e8
