; Frame CatppuccinMocha - qt5ct colour scheme (goes to ~/.config/qt5ct/colors/frame-catppuccinmocha.conf)
; The palette Qt apps use while Catppuccin Mocha is the shell's theme (scripts/theme.sh switches it),
; the same as the FrameCatppuccinMocha Kvantum theme's and the Frame-CatppuccinMocha GTK theme's.
; Made by themes/make-themes.py: change the theme's colours in Config.qml (Noir's: its palette
; in make-themes.py) and run it again.
; Each line lists the colours for one state (active / disabled / inactive) in qt5ct's fixed order.

[ColorScheme]
active_colors=#ffcdd6f4, #ff343546, #ff3c3e50, #ff363748, #ff11111b, #ff232334, #ffcdd6f4, #ffcdd6f4, #ffcdd6f4, #ff1e1e2e, #ff1e1e2e, #ff000000, #ff45475a, #ffcdd6f4, #ff89b4fa, #ffb4befe, #ff232334, #ff000000, #ff2d2e3f, #ffcdd6f4, #ff8b90a9
disabled_colors=#ff6a6e83, #ff343546, #ff3c3e50, #ff363748, #ff11111b, #ff232334, #ff6a6e83, #ffcdd6f4, #ff6a6e83, #ff1e1e2e, #ff1e1e2e, #ff000000, #ff3c3e50, #ff8b90a9, #ff6a6e83, #ff6a6e83, #ff232334, #ff000000, #ff2d2e3f, #ffcdd6f4, #ff585b6f
inactive_colors=#ffcdd6f4, #ff343546, #ff3c3e50, #ff363748, #ff11111b, #ff232334, #ffcdd6f4, #ffcdd6f4, #ffcdd6f4, #ff1e1e2e, #ff1e1e2e, #ff000000, #ff45475a, #ffcdd6f4, #ff89b4fa, #ffb4befe, #ff232334, #ff000000, #ff2d2e3f, #ffcdd6f4, #ff8b90a9
