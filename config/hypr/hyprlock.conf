# Frame - hyprlock (lock screen)  ->  ~/.config/hypr/hyprlock.conf
# Same look as the shell: #1a1a1a panel, 2px #313131 border, Clarity City.
# (hyprlock exits with an error if this file is missing, so it is installed by install.sh)

general {
    hide_cursor        = true
    ignore_empty_input = true
}

# blurred wallpaper: the login screen's copy of the wallpaper you picked (the shell
# updates it when you switch, SUPER + Left / Right); a plain dark colour if it is missing
background {
    monitor     =
    path        = /usr/share/sddm/themes/pixie/assets/wallpaper.png
    color       = rgba(26, 26, 26, 1.0)
    blur_passes = 3
    blur_size   = 6
    brightness  = 0.6
}

# the panel
shape {
    monitor      =
    size         = 440, 330
    color        = rgba(26, 26, 26, 1.0)
    rounding     = 26
    border_size  = 2                       # the same 2px #313131 border as the shell's frame (its default)
    border_color = rgba(49, 49, 49, 1.0)
    position     = 0, 0
    halign       = center
    valign       = center
}

# time
label {
    monitor     =
    text        = $TIME
    color       = rgba(255, 255, 255, 1.0)
    font_size   = 86
    font_family = Clarity City Semi-Bold
    position    = 0, 82
    halign      = center
    valign      = center
}

# date
label {
    monitor     =
    text        = cmd[update:60000] date +"%A, %B %-d"
    color       = rgba(140, 140, 140, 1.0)
    font_size   = 18
    font_family = Clarity City
    position    = 0, 10
    halign      = center
    valign      = center
}

# password
input-field {
    monitor           =
    size              = 320, 54
    outline_thickness = 1
    rounding          = 16
    dots_size         = 0.28
    dots_spacing      = 0.25
    dots_center       = true
    outer_color       = rgba(49, 49, 49, 1.0)
    inner_color       = rgba(42, 42, 42, 1.0)
    font_color        = rgba(255, 255, 255, 1.0)
    font_family       = Clarity City
    check_color       = rgba(255, 180, 84, 1.0)
    fail_color        = rgba(255, 107, 107, 1.0)
    fail_text         = <i>$FAIL</i>
    placeholder_text  = <span foreground="##8c8c8c">Password</span>
    fade_on_empty     = false
    position          = 0, -78
    halign            = center
    valign            = center
}
