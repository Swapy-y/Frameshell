; Frame Noir - qt6ct colour scheme (goes to ~/.config/qt6ct/colors/frame-noir.conf)
; The palette Qt apps use while Noir is the shell's theme (scripts/theme.sh switches it),
; the same as the FrameNoir Kvantum theme's and the Frame-Noir GTK theme's.
; Made by themes/make-themes.py: change the palette there and run it again.
; Each line lists the colours for one state (active / disabled / inactive) in qt6ct's fixed order.

[ColorScheme]
active_colors=#ffffffff, #ff060606, #ff161616, #ff0d0d0d, #ff000000, #ff060606, #ffffffff, #ffffffff, #ffffffff, #ff000000, #ff000000, #ff000000, #ff222222, #ffffffff, #ff6aa3d9, #ffb48ead, #ff060606, #ff000000, #ff060606, #ffffffff, #ff8c8c8c, #ffffffff
disabled_colors=#ff575757, #ff060606, #ff161616, #ff0d0d0d, #ff000000, #ff060606, #ff575757, #ffffffff, #ff575757, #ff000000, #ff000000, #ff000000, #ff060606, #ff8c8c8c, #ff575757, #ff575757, #ff060606, #ff000000, #ff060606, #ffffffff, #ff3a3a3a, #ff3a3a3a
inactive_colors=#ffffffff, #ff060606, #ff161616, #ff0d0d0d, #ff000000, #ff060606, #ffffffff, #ffffffff, #ffffffff, #ff000000, #ff000000, #ff000000, #ff222222, #ffffffff, #ff6aa3d9, #ffb48ead, #ff060606, #ff000000, #ff060606, #ffffffff, #ff8c8c8c, #ffffffff
