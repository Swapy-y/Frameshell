[General]
# frameshell's version of Pixie's theme.conf: the desktop wallpaper and the
# shell's greys. The login screen (SDDM) and the lock screen both read this.
# Edit it with sudo; install.sh keeps your edits when you run it again.
# The colours below are only used without theme.conf.user next to this
# file: the shell writes the login colours of its colour theme there
# (loginBackground ... in ~/.config/quickshell/frame/Config.qml), and it wins.

# Path to the wallpaper. install.sh copies your desktop wallpaper to
# assets/wallpaper.png (Pixie's own forest is still there: assets/background.jpg)
background=assets/wallpaper.png

# Colors
# accentColor: the avatar letter, the session icon, and the clock unless set below
accentColor=#c4c4c4
# hourColor / minuteColor: the clock's hours and minutes (empty: a colour made
# from the accentColor - white for this light grey)
hourColor=
minuteColor=
# cornerColor: the date and the power icons and labels in the top corners
# fieldColor: the password field's border and the round button
# (empty: the accentColor)
cornerColor=
fieldColor=
# accentTextColor: the arrow on the round button (dark on the light grey)
accentTextColor=#1a1a1a
# errorColor: the card after a wrong password (empty: #442222)
errorColor=
# autoColor=true picks the accent from the wallpaper instead (Pixie's default)
autoColor=false
use24HourClock=false
# the card (and, a little lighter, the password field)
backgroundColor=#1a1a1a
textColor=#e3e3e3

# Font family. Override with any installed system font.
fontFamily=
