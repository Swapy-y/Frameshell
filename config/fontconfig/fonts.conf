<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Frame — fontconfig  ->  ~/.config/fontconfig/fonts.conf
     Monospace apps (VS Code, terminals, …) get JetBrains Mono. UI text stays on your system sans,
     the shell / rofi / hyprlock / GTK settings name Clarity City explicitly. -->
<fontconfig>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
    </prefer>
  </alias>
  <alias>
    <family>emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
</fontconfig>
