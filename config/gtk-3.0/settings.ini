# Frame - GTK 3.0  (goes to ~/.config/gtk-3.0/settings.ini)
# The Frame theme (the shell's colours, ~/.local/share/themes/Frame), the YAMIS icon pack and the
# Clarity City font for GTK apps (pavucontrol, file pickers ...).
# hyprland.lua sets the same values through gsettings once, so libadwaita apps follow too.
# Change gtk-icon-theme-name to use another icon pack. Another GTK theme: see the README (section 5).

[Settings]
gtk-theme-name=Frame
gtk-icon-theme-name=YAMIS
gtk-font-name=Clarity City 10
gtk-cursor-theme-name=Simp1e-Adw-Dark
gtk-cursor-theme-size=24
gtk-application-prefer-dark-theme=1
gtk-decoration-layout=:
gtk-enable-animations=true
# no pasting with the middle mouse button (scroll wheel click)
gtk-enable-primary-paste=false
