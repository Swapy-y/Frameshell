; Frame Mocha - qt5ct colour scheme (goes to ~/.config/qt5ct/colors/frame-mocha.conf)
; The palette Qt apps use while Mocha is the shell's theme (scripts/theme.sh switches it),
; the same as the FrameMocha Kvantum theme's and the Frame-Mocha GTK theme's.
; Made by themes/make-themes.py: change the palette there and run it again.
; Each line lists the colours for one state (active / disabled / inactive) in qt5ct's fixed order.

[ColorScheme]
active_colors=#ffcdd6f4, #ff313244, #ff45475a, #ff313244, #ff11111b, #ff1e1e2e, #ffcdd6f4, #ffcdd6f4, #ffcdd6f4, #ff181825, #ff181825, #ff000000, #ff474859, #ffcdd6f4, #ff89b4fa, #ffb4befe, #ff1e1e2e, #ff000000, #ff313244, #ffcdd6f4, #ff9399b2
disabled_colors=#ff6c7086, #ff313244, #ff45475a, #ff313244, #ff11111b, #ff1e1e2e, #ff6c7086, #ffcdd6f4, #ff6c7086, #ff181825, #ff181825, #ff000000, #ff313244, #ff9399b2, #ff6c7086, #ff6c7086, #ff1e1e2e, #ff000000, #ff313244, #ffcdd6f4, #ff585b70
inactive_colors=#ffcdd6f4, #ff313244, #ff45475a, #ff313244, #ff11111b, #ff1e1e2e, #ffcdd6f4, #ffcdd6f4, #ffcdd6f4, #ff181825, #ff181825, #ff000000, #ff474859, #ffcdd6f4, #ff89b4fa, #ffb4befe, #ff1e1e2e, #ff000000, #ff313244, #ffcdd6f4, #ff9399b2
