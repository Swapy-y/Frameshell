; Frame Gruvbox - qt6ct colour scheme (goes to ~/.config/qt6ct/colors/frame-gruvbox.conf)
; The palette Qt apps use while Gruvbox is the shell's theme (scripts/theme.sh switches it),
; the same as the FrameGruvbox Kvantum theme's and the Frame-Gruvbox GTK theme's.
; Made by themes/make-themes.py: change the theme's colours in Config.qml (Noir's: its palette
; in make-themes.py) and run it again.
; Each line lists the colours for one state (active / disabled / inactive) in qt6ct's fixed order.

[ColorScheme]
active_colors=#ffd4be98, #ff433e3c, #ff4e4743, #ff45403e, #ff171717, #ff2e2d2c, #ffd4be98, #ffd4be98, #ffd4be98, #ff282828, #ff282828, #ff000000, #ff504945, #ffd4be98, #ff7daea3, #ffd3869b, #ff2e2d2c, #ff000000, #ff3b3836, #ffd4be98, #ffa6967a, #ff7daea3
disabled_colors=#ff807461, #ff433e3c, #ff4e4743, #ff45403e, #ff171717, #ff2e2d2c, #ff807461, #ffd4be98, #ff807461, #ff282828, #ff282828, #ff000000, #ff4e4743, #ffa6967a, #ff807461, #ff807461, #ff2e2d2c, #ff000000, #ff3b3836, #ffd4be98, #ff6b6253, #ff6b6253
inactive_colors=#ffd4be98, #ff433e3c, #ff4e4743, #ff45403e, #ff171717, #ff2e2d2c, #ffd4be98, #ffd4be98, #ffd4be98, #ff282828, #ff282828, #ff000000, #ff504945, #ffd4be98, #ff7daea3, #ffd3869b, #ff2e2d2c, #ff000000, #ff3b3836, #ffd4be98, #ffa6967a, #ff7daea3
