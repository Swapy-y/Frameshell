; Frame RosePine - qt6ct colour scheme (goes to ~/.config/qt6ct/colors/frame-rosepine.conf)
; The palette Qt apps use while Rose Pine is the shell's theme (scripts/theme.sh switches it),
; the same as the FrameRosePine Kvantum theme's and the Frame-RosePine GTK theme's.
; Made by themes/make-themes.py: change the theme's colours in Config.qml (Noir's: its palette
; in make-themes.py) and run it again.
; Each line lists the colours for one state (active / disabled / inactive) in qt6ct's fixed order.

[ColorScheme]
active_colors=#ffe0def4, #ff2f2c3e, #ff373548, #ff312e40, #ff0e0d15, #ff1e1b2a, #ffe0def4, #ffe0def4, #ffe0def4, #ff191724, #ff191724, #ff000000, #ff403d52, #ffe0def4, #ffc4a7e7, #ffebbcba, #ff1e1b2a, #ff000000, #ff282636, #ffe0def4, #ff8c8a9c, #ffebbcba
disabled_colors=#ff6a6878, #ff2f2c3e, #ff373548, #ff312e40, #ff0e0d15, #ff1e1b2a, #ff6a6878, #ffe0def4, #ff6a6878, #ff191724, #ff191724, #ff000000, #ff373548, #ff8c8a9c, #ff6a6878, #ff6a6878, #ff1e1b2a, #ff000000, #ff282636, #ffe0def4, #ff585665, #ff585665
inactive_colors=#ffe0def4, #ff2f2c3e, #ff373548, #ff312e40, #ff0e0d15, #ff1e1b2a, #ffe0def4, #ffe0def4, #ffe0def4, #ff191724, #ff191724, #ff000000, #ff403d52, #ffe0def4, #ffc4a7e7, #ffebbcba, #ff1e1b2a, #ff000000, #ff282636, #ffe0def4, #ff8c8a9c, #ffebbcba
