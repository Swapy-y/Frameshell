; Frame Everforest - qt6ct colour scheme (goes to ~/.config/qt6ct/colors/frame-everforest.conf)
; The palette Qt apps use while Everforest is the shell's theme (scripts/theme.sh switches it),
; the same as the FrameEverforest Kvantum theme's and the Frame-Everforest GTK theme's.
; Made by themes/make-themes.py: change the theme's colours in Config.qml (Noir's: its palette
; in make-themes.py) and run it again.
; Each line lists the colours for one state (active / disabled / inactive) in qt6ct's fixed order.

[ColorScheme]
active_colors=#ffd3c6aa, #ff424e52, #ff4a575c, #ff445054, #ff1a1f22, #ff313b40, #ffd3c6aa, #ffd3c6aa, #ffd3c6aa, #ff2d353b, #ff2d353b, #ff000000, #ff4e5c60, #ffd3c6aa, #ff7fbbb3, #ffd699b6, #ff313b40, #ff000000, #ff3b464b, #ffd3c6aa, #ffa39d8a, #ff7fbbb3
disabled_colors=#ff817f73, #ff424e52, #ff4a575c, #ff445054, #ff1a1f22, #ff313b40, #ff817f73, #ffd3c6aa, #ff817f73, #ff2d353b, #ff2d353b, #ff000000, #ff4a575c, #ffa39d8a, #ff817f73, #ff817f73, #ff313b40, #ff000000, #ff3b464b, #ffd3c6aa, #ff6f6f67, #ff6f6f67
inactive_colors=#ffd3c6aa, #ff424e52, #ff4a575c, #ff445054, #ff1a1f22, #ff313b40, #ffd3c6aa, #ffd3c6aa, #ffd3c6aa, #ff2d353b, #ff2d353b, #ff000000, #ff4e5c60, #ffd3c6aa, #ff7fbbb3, #ffd699b6, #ff313b40, #ff000000, #ff3b464b, #ffd3c6aa, #ffa39d8a, #ff7fbbb3
