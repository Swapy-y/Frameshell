; Frame Kanagawa - qt6ct colour scheme (goes to ~/.config/qt6ct/colors/frame-kanagawa.conf)
; The palette Qt apps use while Kanagawa is the shell's theme (scripts/theme.sh switches it),
; the same as the FrameKanagawa Kvantum theme's and the Frame-Kanagawa GTK theme's.
; Made by themes/make-themes.py: change the theme's colours in Config.qml (Noir's: its palette
; in make-themes.py) and run it again.
; Each line lists the colours for one state (active / disabled / inactive) in qt6ct's fixed order.

[ColorScheme]
active_colors=#ffdcd7ba, #ff343443, #ff3c3c4e, #ff363645, #ff121217, #ff23232e, #ffdcd7ba, #ffdcd7ba, #ffdcd7ba, #ff1f1f28, #ff1f1f28, #ff000000, #ff404053, #ffdcd7ba, #ff7e9cd8, #ff957fb8, #ff23232e, #ff000000, #ff2e2e3b, #ffdcd7ba, #ff959283, #ffdcd7ba
disabled_colors=#ff716f68, #ff343443, #ff3c3c4e, #ff363645, #ff121217, #ff23232e, #ff716f68, #ffdcd7ba, #ff716f68, #ff1f1f28, #ff1f1f28, #ff000000, #ff3c3c4e, #ff959283, #ff716f68, #ff716f68, #ff23232e, #ff000000, #ff2e2e3b, #ffdcd7ba, #ff5e5c59, #ff5e5c59
inactive_colors=#ffdcd7ba, #ff343443, #ff3c3c4e, #ff363645, #ff121217, #ff23232e, #ffdcd7ba, #ffdcd7ba, #ffdcd7ba, #ff1f1f28, #ff1f1f28, #ff000000, #ff404053, #ffdcd7ba, #ff7e9cd8, #ff957fb8, #ff23232e, #ff000000, #ff2e2e3b, #ffdcd7ba, #ff959283, #ffdcd7ba
