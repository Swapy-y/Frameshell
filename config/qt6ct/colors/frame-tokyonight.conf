; Frame TokyoNight - qt6ct colour scheme (goes to ~/.config/qt6ct/colors/frame-tokyonight.conf)
; The palette Qt apps use while Tokyo Night is the shell's theme (scripts/theme.sh switches it),
; the same as the FrameTokyoNight Kvantum theme's and the Frame-TokyoNight GTK theme's.
; Made by themes/make-themes.py: change the theme's colours in Config.qml (Noir's: its palette
; in make-themes.py) and run it again.
; Each line lists the colours for one state (active / disabled / inactive) in qt6ct's fixed order.

[ColorScheme]
active_colors=#ffc0caf5, #ff2b3045, #ff313851, #ff2c3248, #ff0f1016, #ff1e1f2d, #ffc0caf5, #ffc0caf5, #ffc0caf5, #ff1a1b26, #ff1a1b26, #ff000000, #ff343c57, #ffc0caf5, #ff7aa2f7, #ffbb9af7, #ff1e1f2d, #ff000000, #ff262a3c, #ffc0caf5, #ff868dac, #ff7aa2f7
disabled_colors=#ff666b84, #ff2b3045, #ff313851, #ff2c3248, #ff0f1016, #ff1e1f2d, #ff666b84, #ffc0caf5, #ff666b84, #ff1a1b26, #ff1a1b26, #ff000000, #ff313851, #ff868dac, #ff666b84, #ff666b84, #ff1e1f2d, #ff000000, #ff262a3c, #ffc0caf5, #ff54596f, #ff54596f
inactive_colors=#ffc0caf5, #ff2b3045, #ff313851, #ff2c3248, #ff0f1016, #ff1e1f2d, #ffc0caf5, #ffc0caf5, #ffc0caf5, #ff1a1b26, #ff1a1b26, #ff000000, #ff343c57, #ffc0caf5, #ff7aa2f7, #ffbb9af7, #ff1e1f2d, #ff000000, #ff262a3c, #ffc0caf5, #ff868dac, #ff7aa2f7
