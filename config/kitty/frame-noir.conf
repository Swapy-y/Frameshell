# Frame - kitty (terminal)  ->  ~/.config/kitty/kitty.conf
# Same greys as the shell. Sections: font, window, cursor, tabs, colours, keys.

# font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Line hight
modify_font cell_height 95%

# window
window_padding_width     10
confirm_os_window_close  0
enable_audio_bell        no
hide_window_decorations  yes
remember_window_size     no
initial_window_width     1000
initial_window_height    640

# cursor / scrollback
cursor_shape             beam
cursor_blink_interval    0
scrollback_lines         10000
copy_on_select           clipboard
# no pasting with the middle mouse button (scroll wheel click)
mouse_map middle release ungrabbed no_op
mouse_map shift+middle release ungrabbed,grabbed no_op
mouse_hide_wait          3.0
shell_integration        enabled

# the trail effect
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# tabs (only visible with 2+ tabs)
tab_bar_edge             bottom
tab_bar_style            separator
tab_separator            "  "
active_tab_foreground    #ffffff
active_tab_background    #2a2a2a
inactive_tab_foreground  #8c8c8c
inactive_tab_background  #1a1a1a
tab_bar_background       #1a1a1a

# colours — same greys as the shell
foreground               #e6e6e6
background               #000000
background_opacity       1.0
selection_foreground     none
selection_background     #222222
cursor                   #ffffff
cursor_text_color        #1a1a1a
url_color                #6aa3d9
active_border_color      #7a7a7a
inactive_border_color    #313131

color0   #3a3a3a
color8   #5a5a5a
# Arrow error
color1   #ffffff
# Not full command
color9   #c4c4c4
color2   #8fbf7f
color10  #a6d896
color3   #e5c07b
color11  #ffb454
# Prompt
color4   #ffffff
color12  #86b9ee
# Arrow
color5   #ffffff
color13  #c9a3c2
# Underlined file
color6   #ffffff
color14  #ffffff
color7   #d0d0d0
color15  #ffffff

# Blur
background_opacity 0.85

# keys
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left  previous_tab
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0
