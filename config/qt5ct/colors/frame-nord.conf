; Frame Nord - qt5ct colour scheme (goes to ~/.config/qt5ct/colors/frame-nord.conf)
; The palette Qt apps use while Nord is the shell's theme (scripts/theme.sh switches it),
; the same as the FrameNord Kvantum theme's and the Frame-Nord GTK theme's.
; Made by themes/make-themes.py: change the theme's colours in Config.qml (Noir's: its palette
; in make-themes.py) and run it again.
; Each line lists the colours for one state (active / disabled / inactive) in qt5ct's fixed order.

[ColorScheme]
active_colors=#ffd8dee9, #ff414a5c, #ff495366, #ff434c5e, #ff1b1e25, #ff323946, #ffd8dee9, #ffd8dee9, #ffd8dee9, #ff2e3440, #ff2e3440, #ff000000, #ff4c576b, #ffd8dee9, #ff88c0d0, #ffb48ead, #ff323946, #ff000000, #ff3b4353, #ffd8dee9, #ffa2a8b3
disabled_colors=#ff7d838e, #ff414a5c, #ff495366, #ff434c5e, #ff1b1e25, #ff323946, #ff7d838e, #ffd8dee9, #ff7d838e, #ff2e3440, #ff2e3440, #ff000000, #ff495366, #ffa2a8b3, #ff7d838e, #ff7d838e, #ff323946, #ff000000, #ff3b4353, #ffd8dee9, #ff696f7a
inactive_colors=#ffd8dee9, #ff414a5c, #ff495366, #ff434c5e, #ff1b1e25, #ff323946, #ffd8dee9, #ffd8dee9, #ffd8dee9, #ff2e3440, #ff2e3440, #ff000000, #ff4c576b, #ffd8dee9, #ff88c0d0, #ffb48ead, #ff323946, #ff000000, #ff3b4353, #ffd8dee9, #ffa2a8b3
